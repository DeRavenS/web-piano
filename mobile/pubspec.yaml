name: web_piano
description: "Web Piano for Android — runs the bundled web app (piano, guitar and voice sounds, pitch trainer, vocal exercises) in a WebView."
publish_to: 'none'

version: 2.0.0+2

environment:
  sdk: ^3.10.7

dependencies:
  flutter:
    sdk: flutter
  flutter_inappwebview: ^6.1.5
  permission_handler: ^12.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  # Filled by sync-web.ps1 from the web app in the repo root (git-ignored).
  assets:
    - assets/web/
    - assets/web/samples/salamander/
    - assets/web/samples/guitar-acoustic/
    - assets/web/samples/guitar-electric/
